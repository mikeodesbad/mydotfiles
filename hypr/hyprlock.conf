general {
    hide_cursor = true
}

background {
    path = ~/Downloads/sh2.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    text = $TIME
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    color = rgba(c6c6c8ff)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    size = 260, 44
    outline_thickness = 2
    rounding = 10
    outer_color = rgba(a3c687ee) rgba(7fb4caee) 45deg
    inner_color = rgba(111f21cc)
    font_color = rgba(c6c6c8ff)
    check_color = rgba(7fb4caee)
    fail_color = rgba(e67e80ee)
    placeholder_text = <i>password</i>
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
